services:
  - type: web
    name: debate-tree
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: ./node_modules/.bin/next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: DEMO_MODE
        value: "1"
      - key: PUBLIC_SHARING
        value: "1"
      - key: DEBATE_DB_PATH
        value: /tmp/debate-tree/debates.sqlite
      - key: XAI_API_KEY
        sync: false
